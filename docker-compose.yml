version: '3.8'

services:
  backend:
    build: ./server
    container_name: jai-backend
    restart: always
    ports:
      - "5000:5000"
    # Load environment variables from the backend .env file
    env_file:
      - ./server/.env

  frontend:
    build: ./client
    container_name: jai-frontend
    restart: always
    ports:
      - "3000:3000"
    # Wait for the backend to start before starting the frontend
    depends_on:
      - backend
